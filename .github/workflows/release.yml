# Release workflow: on a pushed vX.Y.Z tag, goreleaser builds the server and
# migrate binaries, archives, a source tarball and their syft SBOMs, signs the
# checksum keylessly with cosign, records a build-provenance attestation, and
# publishes the container image to GitHub Container Registry.
#
# The image is built by ko (see the kos block in .goreleaser.yaml) and carries
# its own SPDX SBOM per manifest, pushed alongside it in the registry.
name: release
# run only on tags
on:
  push:
    tags:
    - "v*"
permissions:
  contents: write # create the GitHub release and upload assets
  packages: write # push the image to ghcr.io
  id-token: write # keyless cosign signing (OIDC)
  attestations: write # build-provenance attestation
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0 # this is important, otherwise it won't checkout the full tree (i.e. no previous tags)
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        # This job publishes artifacts, so a poisoned build cache could reach a
        # released image. Release runs are rare; the cache is not worth that.
        cache: false
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
    # ko resolves registry credentials through the Docker keychain, for both
    # pulling the base image and pushing the result.
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        # Pinned deliberately. The action defaults to `~> v2`, which floats across
        # minor versions, and 2.18 changed what ${artifact} expands to in
        # docker_signs. Keep this in step with .mise.toml.
        version: 2.18.2
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-checksums: ./dist/checksums.txt
    # Attest the image separately: the checksum file covers the archives and
    # source, not the image, which is identified by its registry digest.
    - name: Read the pushed image digest
      id: image
      run: |
        set -euo pipefail
        digest="$(jq -r '.[] | select(.type == "Docker Manifest") | .extra.Digest' dist/artifacts.json)"
        test -n "$digest"
        {
          echo "digest=$digest"
          echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
        } >> "$GITHUB_OUTPUT"
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ steps.image.outputs.name }}
        subject-digest: ${{ steps.image.outputs.digest }}
        push-to-registry: true
