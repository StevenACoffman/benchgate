# Publish the server image to GitHub Container Registry on every push to main.
#
# goreleaser drives ko, which compiles the Go binary and assembles the image
# itself: no Dockerfile, no docker build, and a reproducible layer layout. ko is
# linked into goreleaser as a library, so there is nothing to install for it.
#
# Why this is a real release run and not `--snapshot`: snapshot mode implies
# --skip=publish, so it cannot push anything. Instead the run sets IMAGE_ONLY,
# which disables the GitHub release in .goreleaser.yaml, so the image is built,
# pushed and signed without a release being cut.
#
# Signing needs cosign on PATH and the sign pipe left enabled. goreleaser has
# no skip for the source tarball or checksum, so those are still written to
# dist/ and never uploaded; the sbom pipe is skipped because ko generates the
# image SBOM itself, so syft is not needed here.
name: publish-image
on:
  push:
    branches: [main]
  workflow_dispatch:
# Superseding commits make an in-flight image push pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write # push to ghcr.io
  id-token: write # keyless OIDC for the provenance attestation
  attestations: write
jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0 # goreleaser reads tags and history to derive the version
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        # This job publishes artifacts, so a poisoned build cache could reach a
        # released image. Release runs are rare; the cache is not worth that.
        cache: false
    # docker_signs in .goreleaser.yaml shells out to cosign.
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    # ko resolves registry credentials through the Docker keychain, for both
    # pulling the base image and pushing the result.
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # goreleaser refuses to run without a tag, and a main commit is not tagged.
    # This tag is local to the runner and never pushed; it supplies only the
    # version label, since the image tags come from IMAGE_TAG and the commit.
    - name: Synthesise a version for the build
      run: git tag -f "v0.0.0-main.$(git rev-parse --short=7 HEAD)"
    - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        # Pinned deliberately. The action defaults to `~> v2`, which floats across
        # minor versions, and 2.18 changed what ${artifact} expands to in
        # docker_signs. Keep this in step with .mise.toml.
        version: 2.18.2
        args: release --clean --skip=sbom,validate,announce
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        IMAGE_ONLY: "true" # disables the GitHub release; drops the latest tag
        IMAGE_TAG: main
    # The digest identifies the multi-arch index that was just pushed.
    - name: Read the pushed image digest
      id: image
      run: |
        set -euo pipefail
        digest="$(jq -r '.[] | select(.type == "Docker Manifest") | .extra.Digest' dist/artifacts.json)"
        test -n "$digest"
        {
          echo "digest=$digest"
          echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
        } >> "$GITHUB_OUTPUT"
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ steps.image.outputs.name }}
        subject-digest: ${{ steps.image.outputs.digest }}
        push-to-registry: true
